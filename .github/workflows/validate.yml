name: Validate plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  portrait-atelier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud API 15 SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Dalamud.zip'
          $install = Join-Path $env:RUNNER_TEMP 'Dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          "DALAMUD_HOME=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check portrait transformations
        run: dotnet run --project .\plugins\PortraitAtelier\checks\PortraitAtelier.Checks.csproj --configuration Release
      - name: Build
        run: dotnet build .\plugins\PortraitAtelier\PortraitAtelier.csproj --configuration Release

  strategy-board-library:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud API 15 SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Dalamud.zip'
          $install = Join-Path $env:RUNNER_TEMP 'Dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          "DALAMUD_HOME=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        run: dotnet build .\plugins\StrategyBoardLibrary\StrategyBoardLibrary.csproj --configuration Debug

  retainer-pricer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud API 15 SDK
        shell: pwsh
        run: |
          $dalamudDev = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Path $dalamudDev -Force | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile 'dalamud-latest.zip'
          Expand-Archive -LiteralPath 'dalamud-latest.zip' -DestinationPath $dalamudDev -Force
      - name: Run standalone checks
        run: dotnet run --project .\plugins\RetainerPricer\checks\RetainerPricer.Checks.csproj --configuration Release
      - name: Build package
        run: dotnet build .\plugins\RetainerPricer\RetainerPricer.csproj --configuration Release -p:RestoreLockedMode=true
