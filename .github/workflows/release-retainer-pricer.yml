name: Release Retainer Pricer

on:
  push:
    tags: ["RetainerPricer-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Dalamud API 15 SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Dalamud.zip'
          $install = Join-Path $env:RUNNER_TEMP 'Dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          "DALAMUD_HOME=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^RetainerPricer-v', ''
          [xml]$project = Get-Content 'plugins/RetainerPricer/RetainerPricer.csproj' -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($tagVersion -ne $projectVersion) { throw "Tag version $tagVersion must match project version $projectVersion." }
      - name: Build and package
        run: dotnet build .\plugins\RetainerPricer\RetainerPricer.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Name release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'plugins/RetainerPricer/dist/Release/RetainerPricer/latest.zip' -Destination 'RetainerPricer.zip' -Force
      - name: Preserve packaged plugin manifest
        shell: pwsh
        run: Copy-Item -LiteralPath 'plugins/RetainerPricer/dist/Release/RetainerPricer/RetainerPricer.json' -Destination (Join-Path $env:RUNNER_TEMP 'RetainerPricer.json') -Force
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: RetainerPricer.zip
      - name: Update combined feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch --force-create feed-update --track origin/main
          ./scripts/Update-RepoFeed.ps1 -ManifestPath (Join-Path $env:RUNNER_TEMP 'RetainerPricer.json') -ReleaseTag $env:GITHUB_REF_NAME -AssetName 'RetainerPricer.zip'
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update feed for $env:GITHUB_REF_NAME"
            git push origin HEAD:main
          }
      - name: Announce release changelog on Discord
        shell: pwsh
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Send-DiscordRelease.ps1 -ReleaseTag $env:RELEASE_TAG
